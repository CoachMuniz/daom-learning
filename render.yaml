services:
  - type: web
    name: daom-learning
    runtime: node
    plan: free
    region: ohio
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: GOOGLE_SHEET_ID
        value: 1LlUzvMbEoJ4-ATmecOCyRBgy19Hrib4cdkpyLaspjI4
      - key: TIMEZONE
        value: America/Argentina/Buenos_Aires
      - key: CANARY_PROJECT
        value: DAOM-FORMACION-SHEET-01
      - key: JWT_SECRET
        generateValue: true
      - key: BOT_API_SECRET_KEY
        sync: false
      - key: SYNC_SECRET_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: daom-learning-db
          property: connectionString
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false

databases:
  - name: daom-learning-db
    databaseName: daom_learning
    user: daom_learning_user
    plan: free
    region: ohio
    postgresMajorVersion: "16"
